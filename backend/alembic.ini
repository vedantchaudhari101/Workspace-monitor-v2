# =============================================================================
# Alembic Configuration — Workspace Monitor
# =============================================================================
# A generic, single-database configuration.

[alembic]
# Path to migration environment.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# as well as the filename. Blank uses the default localtime.
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# set to 'true' to allow .hierarchical merge revisions to be created
# regardless of the current branch(es) being on the same head.
# prepend_sys_path = .

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Database URL — this placeholder is overridden at runtime by env.py
# which reads from app.config.Settings.
sqlalchemy.url = driver://user:pass@localhost/dbname
