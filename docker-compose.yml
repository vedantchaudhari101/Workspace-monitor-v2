# =============================================================================
# Workspace Monitor — Docker Compose
# =============================================================================
# One app container (API + CV pipeline + web app) and PostgreSQL 16.
#   docker compose up --build        → http://localhost:8000
# Without PostgreSQL, `docker build . && docker run -p 8000:8000` uses SQLite.
# For a public server with HTTPS, use deploy/oracle/docker-compose.yml instead.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workspace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workspace_pass_dev}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_monitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workspace_user} -d ${POSTGRES_DB:-workspace_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      USE_SQLITE: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-workspace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workspace_pass_dev}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_monitor}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@workspace.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
