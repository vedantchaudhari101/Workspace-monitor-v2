# =============================================================================
# Development: run the API with reload and the Vite dev server on the host.
#   docker compose -f docker-compose.dev.yml up db     # just PostgreSQL
#   cd backend && uvicorn app.main:app --reload         # API on :8000
#   cd frontend && npm run dev                          # web app on :5173
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workspace_user
      POSTGRES_PASSWORD: workspace_pass_dev
      POSTGRES_DB: workspace_monitor
    ports:
      - "5432:5432"
