# =============================================================================
# Workspace Monitor — Docker Compose (Development Overrides)
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Adds hot-reload, exposed dev ports, and debug logging.
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
